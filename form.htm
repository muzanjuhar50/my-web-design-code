<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-primary">
    <h1 class="text-center text-light">AWOLIA SECONDARY SCHOOL</h1>

        <form class="">
        <fieldset class="bg-info">

        <legend class="text-danger text-center font-monospace fs-3">Students Registration Form</legend>

            <p class="ms-5"><lable class="fs-4">First Name:</lable><input type="text" name="name" class="rounded border-primary" placeholder="Enter Your First Name" autofocus required></p><br>

            <p class="ms-5"><lable class="fs-4">Last Name:</lable><input type="text" name="name" class="rounded border-primary" placeholder="Enter Your Last Name" required></p><br>

            <p class="ms-5"><lable class="fs-4">&nbsp;&nbsp;Password:</lable><input type="password" name="password" class="rounded border-primary" placeholder="********" required minlength="6" maxlength="8"></p><br>

            <p class="ms-5"><lable class="fs-4">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;Email:</lable><input type="email" name="email" class="rounded border-primary" placeholder="Example@gmail.com" required></p><br>

            <p class="ms-5"><lable class="fs-4">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; Birthday:</lable><input type="date" max="2008-01-01" min="2004-01-01" name="birthday" class="rounded border-primary" required></p><br>

            <p class="ms-5 fs-4">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;Gender: Male<input type="radio" name="gender" required><br>
            <lable class="ms-5">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;Female</lable><input type="radio" name="gender" required></p><br>


            <p class="ms-5"><lable class="fs-4">Grade & Sec:</lable><input type="text" name="grade" class="rounded border-primary" placeholder="9,10,11,&12" required></p><br>

            <p class="ms-5"><lable class="fs-4">&nbsp; &nbsp; &nbsp; &nbsp; Region:</lable><input type="text" name="region" class="rounded border-primary" placeholder="Addis Ababa" required></p><br>

            <p class="ms-5"><lable class="fs-4">&nbsp; &nbsp; &nbsp; &nbsp; Phone:</lable><input type="number" name="tel" class="rounded border-primary"placeholder="+251977****56" required></p><br>

            <p class="text-center"><input type="Submit" name="Submit" class="btn btn-success fs-5">
            <input type="Reset" name="Reset" class="btn btn-danger fs-5"></p>

        </fieldset>
    </form>


    <script src="js/bootstrap.bundle.js"></script>
</body>
</html>
